services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmp_crm}
      POSTGRES_USER: ${POSTGRES_USER:-cmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cmp} -d ${POSTGRES_DB:-cmp_crm}
      interval: 10s
      timeout: 5s
      retries: 10

  migration:
    image: cmp-crm:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cmp_crm}?schema=public
    entrypoint: ["npx", "prisma", "migrate", "deploy"]

  bootstrap:
    image: cmp-crm:latest
    restart: "no"
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cmp_crm}?schema=public
      ROOT_EMAIL: ${ROOT_EMAIL:?ROOT_EMAIL is required}
      ROOT_PASSWORD: ${ROOT_PASSWORD:?ROOT_PASSWORD is required}
      ROOT_NAME: ${ROOT_NAME:-Root Admin}
    entrypoint: ["node", "prisma/create-root.js"]

  app:
    image: cmp-crm:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - backup_data:/app/backend/backups
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cmp_crm}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      BACKUP_DIR: /app/backend/backups

volumes:
  postgres_data:
    external: true
    name: cloudticket_postgres_data
  backup_data:
