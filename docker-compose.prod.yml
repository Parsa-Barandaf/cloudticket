services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmp_crm}
      POSTGRES_USER: ${POSTGRES_USER:-cmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmp} -d ${POSTGRES_DB:-cmp_crm}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: cmp-crm:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cmp_crm}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      PORT: 4000
      ROOT_EMAIL: ${ROOT_EMAIL}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      ROOT_NAME: ${ROOT_NAME:-Root Admin}
      RUN_SEED: ${RUN_SEED:-false}

volumes:
  postgres_data:
