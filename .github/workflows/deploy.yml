name: CI/CD Pipeline

on:
  push:
    branches: [main, ci-cd/setup]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: cmp-crm

permissions:
  contents: read

concurrency:
  group: cloudticket-production-deploy
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Temporarily disabled
      # - name: Frontend lint
      #   run: npm run lint

      - name: Frontend tests
        run: npm run test -- --run

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Temporarily disabled
      # - name: Backend lint
      #   working-directory: backend
      #   run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: npm run test -- --runInBand

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Save Docker image
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > ${{ env.IMAGE_NAME }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.IMAGE_NAME }}.tar.gz
          retention-days: 1



  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, cloudticket-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Backup current Docker image
        run: |
          if docker image inspect cmp-crm:latest >/dev/null 2>&1; then
            docker tag cmp-crm:latest cmp-crm:rollback
            echo "Previous image backed up."
          else
            echo "No previous image found."
          fi

      - name: Load Docker image
        run: docker load -i cmp-crm.tar.gz

      - name: Deploy CRM
        run: sudo -n /usr/local/sbin/cloudticket-deploy "$GITHUB_WORKSPACE/docker-compose.prod.yml"

      - name: Cleanup local artifact
        if: always()
        run: rm -f cmp-crm.tar.gz
