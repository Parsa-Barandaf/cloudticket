services:
  postgres:
    image: postgres:16-alpine
    container_name: sahab-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sahab_crm
      POSTGRES_USER: sahab
      POSTGRES_PASSWORD: sahab_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sahab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
